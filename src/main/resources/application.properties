spring.application.name=supermarket-api

#data source
spring.datasource.url=jdbc:postgresql://localhost:5436/supermarketDB
spring.datasource.username=docker
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#admin padrão (seed)
app.admin.nome=Administrador
app.admin.sobrenome=Sistema
app.admin.username=admin
app.admin.email=admin@supermarket.com
app.admin.senha=Admin@123

#jwt
jwt.secret=${JWT_SECRET:468041be-f345-4188-8136-4bdeef74b376}

#rabbitmq
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.exchange=supermarket.exchange
app.rabbitmq.fila.redefinicao-senha=fila.redefinicao-senha
app.rabbitmq.routing-key.redefinicao-senha=usuario.senha.redefinida

#e-mail (mailpit local, sem autenticação, em http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.remetente=no-reply@supermarket.com
